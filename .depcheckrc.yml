# .why = depcheck walks the filesystem and never reads .gitignore. rhachet keeps
#        host-local runtime state under .agent/.actors (actor caches, claude code
#        plugin copies); it is gitignored, never source, and its files import
#        packages this repo does not use. upstream: declapract-typescript-ehmpathy#639
ignorePatterns:
  - .agent/.actors
ignores:
  - depcheck
  - declapract
  - declapract-typescript-ehmpathy
  - "@commitlint/config-conventional"
  - serverless-prune-plugin
  - husky
  - if-env
  - rhachet
  - "@tsconfig/node20"
  - "@tsconfig/strictest"
  - "@biomejs/biome"
  - esbuild-register
  - "@swc/core"
  - "@swc/jest"
  - tsx
  - "@src/*"
  - "@src/.*"
  - rhachet-brains-anthropic
  # .why = the self-link (link:.) that enrolls this package's own brains into
  #        this repo's rhachet registry, so reviews can run on the models we
  #        ship. registration happens by install, never by import, so depcheck
  #        cannot observe the use.
  - rhachet-brains-openrouter
  - rhachet-roles-bhrain
  - rhachet-roles-bhrowser
  # .why = the bhrowser role's skills import playwright via the linked .agent
  #        role. depcheck sees that import only where the link exists (local),
  #        so it reads as absent locally without the dep, and unused in ci
  - playwright
  - rhachet-roles-bhuild
  - rhachet-roles-ehmpathy
  - tsc-alias
  - yalc
